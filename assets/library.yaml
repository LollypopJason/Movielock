maps:
  studio:
    name: Studio (no map model)
    sky_color: "#1c1f26"
    ground: true
  rooftop_night:
    name: Rooftop at night
    model: maps/rooftop_night/rooftop.glb
    hdri: hdri/night_city.exr
    sky_color: "#0b1020"
    hdri_strength: 0.6
  street_day:
    name: City street, day
    model: maps/street_day/street.glb
    hdri: hdri/overcast.exr
    sky_color: "#9fb4c8"
  base_interior:
    name: Patron base interior
    model: maps/base_interior/base.glb
    sky_color: "#2a2420"
    hdri_strength: 0.3

sounds:
  explosion_small: {file: sfx/explosion_small.wav, volume: 0.9, description: short explosion}
  gunshot:         {file: sfx/gunshot.wav, description: single shot}
  whoosh:          {file: sfx/whoosh.wav, description: fast movement}
  impact:          {file: sfx/impact.wav, description: heavy hit}
  footsteps:       {file: sfx/footsteps.wav, description: a few footsteps}
  ui_ping:         {file: sfx/ui_ping.wav, description: map ping}

music:
  tense_loop:   {file: music/tense_loop.ogg, volume: 0.35, description: tense standoff}
  upbeat_loop:  {file: music/upbeat_loop.ogg, volume: 0.3, description: light, comedic}
  victory:      {file: music/victory.ogg, volume: 0.4, description: triumphant}

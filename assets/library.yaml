# Movielock asset library. Data only: add heroes, maps and sounds here, no code changes needed.
#
# All paths are relative to this folder (assets/). The files they point to are NOT in git:
# you export them from your own Deadlock install (see docs/ASSETS.md) and drop them in place.
#
# Hero fields
#   name        display name (used in captions and by the AI writer)
#   model       glTF/GLB exported with Source 2 Viewer
#   scale       multiply the imported model (Source units are inches; VRF usually exports metres)
#   height      approximate height in metres: the cameras aim at faces using this
#   yaw_offset  degrees added so the model faces -Y at yaw 0 (try 0, 90, 180, -90)
#   color       storyboard panel colour
#   aliases     other names (game class names, sound folder names) used by tools/import_sounds.py
#   animations  our name -> glTF action name (string) or {action, loop, length, speed}
#               "idle" and "talk" are used automatically; others are used with "name ~ anim"
#   visemes     Rhubarb mouth shape (A-H, X) -> shape key name, list of names, or {name: weight}
#   jaw_bone    fallback when the model has no mouth shape keys: this bone is rotated to open the jaw
#   jaw_open    jaw rotation in degrees for a fully open mouth (D); negative to open the other way
#   jaw_axis    local bone axis for the jaw rotation: X (default), Y or Z
#
# The action names below are placeholders: open your exported model in Blender, look at the
# Action list (Dope Sheet > Action Editor) and put the real names here.

defaults:
  animations: &anims
    idle: {action: idle, loop: true}
    talk: {action: talk, loop: true}
    walk: {action: walk, loop: true}
    run: {action: run, loop: true}
    wave: {action: wave, loop: false}
    point: {action: point, loop: false}
    taunt: {action: taunt, loop: false}
    laugh: {action: laugh, loop: false}
    celebrate: {action: celebrate, loop: false}
    shoot: {action: shoot, loop: false}
    hit: {action: hit_react, loop: false}
    death: {action: death, loop: false}
  visemes: &visemes
    A: mouth_closed        # M, B, P
    B: mouth_teeth         # K, S, T, EE
    C: mouth_open          # EH, AE
    D: mouth_wide          # AA
    E: mouth_round         # AO, ER
    F: mouth_pucker        # UW, OW, W
    G: mouth_fv            # F, V
    H: mouth_l             # L
    X: mouth_rest          # silence

heroes:
